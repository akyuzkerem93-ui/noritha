<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha - İletişim</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f5f3ef;
    color: #2c3e3a;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 60px;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

/* HERO */
.hero {
    padding: 60px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 18px;
    color: #555;
}

/* FORM */
.container {
    padding: 60px;
}

form {
    background: #f0ede8;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.row {
    display: flex;
    gap: 20px;
}

.input-group {
    width: 100%;
    margin-bottom: 20px;
}

label {
    margin-bottom: 8px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: white;
    transition: 0.2s;
}

input:focus, textarea:focus {
    outline: none;
    box-shadow: 0 0 0 2px #2f5d50;
}

/* BUTTON */
button {
    width: 100%;
    padding: 16px;
    border: none;
    background: #2f5d50;
    color: white;
    font-size: 16px;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #24463c;
}

/* INFO */
.info {
    padding: 60px;
    display: flex;
    gap: 40px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    flex: 1;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.card h3 {
    margin-bottom: 10px;
}

/* FOOTER */
footer {
    padding: 60px;
}

footer h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

footer p {
    font-size: 18px;
    color: #555;
}

/* MOBILE */
@media(max-width: 768px){
    .row, .info {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Noritha</div>
</header>

<section class="hero">
    <h1>İletişim</h1>
    <p>Benimle iletişime geçmek için aşağıdaki formu doldurabilirsiniz.</p>
</section>

<section class="container">
    <form>
        <div class="row">
            <div class="input-group">
                <label>Ad Soyad *</label>
                <input type="text" name="ad" required>
            </div>

            <div class="input-group">
                <label>E-posta *</label>
                <input type="email" name="email" required>
            </div>
        </div>

        <div class="input-group">
            <label>Konu *</label>
            <input type="text" name="konu" required>
        </div>

        <div class="input-group">
            <label>Mesajınız *</label>
            <textarea name="mesaj" rows="6" required></textarea>
        </div>

        <button type="submit">Gönder</button>
    </form>
</section>

<section class="info">
    <div class="card">
        <h3>Hızlı Destek</h3>
        <p>Size en kısa sürede geri dönüş yapıyorum.</p>
    </div>

    <div class="card">
        <h3>7/24 Ulaşım</h3>
        <p>İstediğiniz zaman bana yazabilirsiniz.</p>
    </div>
</section>

<footer>
    <h2>DESTEK</h2>
    <p>support@noritha.com</p>
</footer>

</body>
</html>
