<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha</title>

<style>
body{
    margin:0;
    font-family: system-ui;
    background:#0b1220;
    color:#e5e7eb;
    overflow-x:hidden;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background: linear-gradient(135deg, #0f172a, #111827);
}

.hero h1{
    font-size:60px;
    margin:0;
}

.hero p{
    opacity:0.7;
    max-width:600px;
    line-height:1.6;
}

/* SECTIONS */
.section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:60px 20px;

    opacity:0;
    transform: translateY(60px);
    transition: all 1s ease;
}

.section.show{
    opacity:1;
    transform: translateY(0);
}

.card{
    background: rgba(255,255,255,0.05);
    padding:20px;
    margin:10px;
    border-radius:12px;
    width:250px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    opacity:0.5;
}
</style>

</head>

<body>

<div class="hero">
    <h1>Noritha</h1>
    <p>Minimal, modern ve akıcı bir web deneyimi.</p>
</div>

<div class="section">
    <h2>Hakkında</h2>
    <p>Bu site modern scroll animasyonları ile hazırlanmıştır.</p>
</div>

<div class="section">
    <h2>Özellikler</h2>
    <div class="container">
        <div class="card">Temiz Tasarım</div>
        <div class="card">Hızlı Yapı</div>
        <div class="card">Mobil Uyum</div>
    </div>
</div>

<div class="section">
    <h2>İletişim</h2>
    <p>Bize ulaşmak için aşağı kaydırmanız yeterli.</p>
</div>

<footer>
    © 2026 Noritha
</footer>

<script>
const sections = document.querySelectorAll('.section');

window.addEventListener('scroll', () => {
    const trigger = window.innerHeight * 0.85;

    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;

        if(top < trigger){
            sec.classList.add('show');
        }
    });
});
</script>

</body>
</html>
