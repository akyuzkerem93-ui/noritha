<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha</title>

<style>
body{
    margin:0;
    font-family: system-ui;
    background:#0b1220;
    color:#e5e7eb;
    overflow-x:hidden;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background: linear-gradient(135deg, #0f172a, #111827);
    padding:10px;
}

.hero h1{
    font-size:54px;
    margin:0;
}

.hero p{
    opacity:0.75;
    max-width:520px;
    line-height:1.5;
    margin-top:8px;
}

/* SECTIONS */
.section{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px 10px;

    opacity:0;
    transform: translateY(30px);
    transition: all 0.7s ease;
}

.section.show{
    opacity:1;
    transform: translateY(0);
}

.section h2{
    margin-bottom:8px;
    font-size:24px;
}

.section p{
    opacity:0.7;
    max-width:520px;
    line-height:1.5;
    margin-bottom:15px;
}

/* CARDS */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.card{
    background: rgba(255,255,255,0.05);
    padding:14px;
    border-radius:10px;
    width:210px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-2px);
    background: rgba(255,255,255,0.08);
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    opacity:0.5;
    font-size:13px;
}
</style>

</head>

<body>

<div class="hero">
    <h1>Noritha</h1>
    <p>Minimal, sade ve akıcı bir web deneyimi.</p>
</div>

<div class="section">
    <h2>Hakkında</h2>
    <p>Modern tasarım ve temiz yapı ile hazırlanmış sade bir web sitesi.</p>
</div>

<div class="section">
    <h2>Özellikler</h2>
    <div class="container">
        <div class="card">Temiz Tasarım</div>
        <div class="card">Hızlı Yapı</div>
        <div class="card">Mobil Uyum</div>
    </div>
</div>

<div class="section">
    <h2>İletişim</h2>
    <p>Basit, hızlı ve modern bir deneyim.</p>
</div>

<footer>
    © 2026 Noritha
</footer>

<script>
const sections = document.querySelectorAll('.section');

window.addEventListener('scroll', () => {
    const trigger = window.innerHeight * 0.88;

    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;

        if(top < trigger){
            sec.classList.add('show');
        }
    });
});
</script>

</body>
</html>
