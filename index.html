<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    text-align: center;
}

header {
    padding: 60px 20px;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    opacity: 0.8;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: #38bdf8;
    color: black;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.section {
    padding: 60px 20px;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    display: inline-block;
    width: 250px;
}

footer {
    padding: 20px;
    font-size: 14px;
    opacity: 0.6;
}
</style>

</head>

<body>

<header>
    <h1>Noritha</h1>
    <p>Modern ve sade web siteme hoş geldin</p>
    <a class="btn" href="#">Başla</a>
</header>

<div class="section">
    <div class="card">🚀 Hızlı Tasarım</div>
    <div class="card">🎨 Modern Görünüm</div>
    <div class="card">📱 Mobil Uyumlu</div>
</div>

<footer>
    © 2026 Noritha - Tüm hakları saklıdır
</footer>

</body>
</html>
