<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#fff;
    color:#000;
    font-family: Arial, sans-serif;
}

header{
    position:fixed;
    top:0;
    width:100%;
    padding:25px 55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.9);
}

.logo{
    font-family:"Times New Roman", serif;
    font-size:32px;
    letter-spacing:3px;
}

nav a{
    margin-left:30px;
    text-decoration:none;
    color:#000;
    font-size:14px;
}

/* HERO */
.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e") center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.hero h1{
    font-family:"Times New Roman", serif;
    font-size:70px;
    letter-spacing:5px;
}

/* CONTACT */
.contact{
    padding:100px 60px;
    background:#f5f5f5;
}

.contact h2{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
    font-family:"Times New Roman", serif;
}

form{
    max-width:900px;
    margin:auto;
    background:white;
    padding:40px;
}

.row{
    display:flex;
    gap:20px;
}

.input-group{
    width:100%;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:16px;
    background:#000;
    color:white;
    border:none;
    cursor:pointer;
}

/* FOOTER */
footer{
    padding:70px;
    text-align:center;
    background:#000;
    color:white;
}

footer small{
    display:block;
    margin-top:10px;
    color:#aaa;
    font-size:12px;
}

@media(max-width:768px){
    nav{display:none;}
    .row{flex-direction:column;}
}
</style>
</head>

<body>

<header>
    <div class="logo">Noritha</div>
    <nav>
        <a href="#contact">Bana Ulaşın</a>
        <a href="#destek">Destek</a>
    </nav>
</header>

<section class="hero">
    <h1>NORITHA</h1>
</section>

<section class="contact" id="contact">
    <h2>Bana Ulaşın</h2>

    <form>
        <div class="row">
            <input type="text" placeholder="Ad Soyad" required>
            <input type="email" placeholder="E-posta" required>
        </div>

        <input type="text" placeholder="Konu" required>
        <textarea rows="6" placeholder="Mesajınız" required></textarea>

        <button type="submit">GÖNDER</button>
    </form>
</section>

<footer id="destek">
    <h2>DESTEK</h2>
    <p>support@noritha.com</p>
    <small>Noritha 2026 © Tüm hakları saklıdır</small>
</footer>

</body>
</html>
