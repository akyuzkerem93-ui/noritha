<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noritha</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#fff;
    color:#000;
    font-family: Arial, sans-serif;
}

header{
    position:fixed;
    top:0;
    width:100%;
    padding:25px 55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.9);
}

.logo{
    font-family:"Times New Roman", serif;
    font-size:32px;
    letter-spacing:3px;
}

nav a{
    margin-left:30px;
    text-decoration:none;
    color:#000;
    font-size:14px;
}

/* HERO */
.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e") center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.hero h1{
    font-family:"Times New Roman", serif;
    font-size:70px;
    letter-spacing:5px;
}

/* CONTACT */
.contact{
    padding:100px 60px;
    background:#f5f5f5;
}

.contact h2{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
    font-family:"Times New Roman", serif;
}

form{
    max-width:900px;
    margin:auto;
    background:white;
    padding:40px;
}

.row{
    display:flex;
    gap:20px;
}

.input-group{
    width:100%;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:16px;
    background:#000;
    color:white;
    border:none;
    cursor:pointer;
}

/* TABLE */
.table-section{
    padding:100px 60px;
}

.table-section h2{
    text-align:center;
    font-size:38px;
    margin-bottom:30px;
    font-family:"Times New Roman", serif;
}

table{
    width:100%;
    max-width:1100px;
    margin:auto;
    border-collapse:collapse;
}

th, td{
    padding:14px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

th{
    background:#000;
    color:white;
}

td:nth-child(2){
    text-align:left;
}

/* FOOTER */
footer{
    padding:70px;
    text-align:center;
    background:#000;
    color:white;
}

footer small{
    display:block;
    margin-top:10px;
    color:#aaa;
    font-size:12px;
}

@media(max-width:768px){
    nav{display:none;}
    .row{flex-direction:column;}
}
</style>
</head>

<body>

<header>
    <div class="logo">Noritha</div>
    <nav>
        <a href="#contact">Bana Ulaşın</a>
        <a href="#puan">Süper Lig</a>
        <a href="#destek">Destek</a>
    </nav>
</header>

<section class="hero">
    <h1>NORITHA</h1>
</section>

<section class="contact" id="contact">
    <h2>Bana Ulaşın</h2>

    <form>
        <div class="row">
            <input type="text" placeholder="Ad Soyad" required>
            <input type="email" placeholder="E-posta" required>
        </div>

        <input type="text" placeholder="Konu" required>
        <textarea rows="6" placeholder="Mesajınız" required></textarea>

        <button type="submit">GÖNDER</button>
    </form>
</section>

<section class="table-section" id="puan">
    <h2>Süper Lig Puan Tablosu</h2>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Takım</th>
                <th>O</th>
                <th>G</th>
                <th>B</th>
                <th>M</th>
                <th>AV</th>
                <th>P</th>
            </tr>
        </thead>
        <tbody id="puanTablosu">
            <tr>
                <td colspan="8">Yükleniyor...</td>
            </tr>
        </tbody>
    </table>
</section>

<footer id="destek">
    <h2>DESTEK</h2>
    <p>support@noritha.com</p>
    <small>Noritha 2026 © Tüm hakları saklıdır</small>
</footer>

<script>
const API_KEY = "9e8a1a3f24cc45ac8a95d2b1e635b39e";

async function superLigTablosuGetir() {
    const tbody = document.getElementById("puanTablosu");

    try {
        const response = await fetch("https://api.football-data.org/v4/competitions/TSL/standings", {
            headers: {
                "X-Auth-Token": API_KEY
            }
        });

        const data = await response.json();
        const tablo = data.standings[0].table;

        tbody.innerHTML = "";

        tablo.forEach(takim => {
            tbody.innerHTML += `
                <tr>
                    <td>${takim.position}</td>
                    <td>${takim.team.name}</td>
                    <td>${takim.playedGames}</td>
                    <td>${takim.won}</td>
                    <td>${takim.draw}</td>
                    <td>${takim.lost}</td>
                    <td>${takim.goalDifference}</td>
                    <td>${takim.points}</td>
                </tr>
            `;
        });

    } catch (error) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8">Tablo yüklenemedi</td>
            </tr>
        `;
    }
}

superLigTablosuGetir();
</script>

</body>
</html>
