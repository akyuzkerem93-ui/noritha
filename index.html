<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noritha - İletişim</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f3ef;
            color: #2c3e3a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #2c3e3a;
        }

        .container {
            padding: 50px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        form {
            background: #f0ede8;
            padding: 30px;
            border-radius: 10px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            background: #ffffff;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background: #2f5d50;
            color: white;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #24463c;
        }

        footer {
            margin-top: 40px;
            padding: 30px 50px;
        }

        footer h2 {
            font-size: 32px;
        }

        /* Mobil uyum */
        @media(max-width: 768px){
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Noritha</div>
    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#">Projeler</a>
    </nav>
</header>

<section class="container">
    <h1>İletişim</h1>

    <form>
        <div class="row">
            <div class="input-group">
                <label>Ad Soyad *</label>
                <input type="text" required>
            </div>

            <div class="input-group">
                <label>E-posta *</label>
                <input type="email" required>
            </div>
        </div>

        <div class="input-group">
            <label>Konu *</label>
            <input type="text" required>
        </div>

        <div class="input-group">
            <label>Mesajınız *</label>
            <textarea rows="6" required></textarea>
        </div>

        <button type="submit">Gönder</button>
    </form>
</section>

<footer>
    <h2>DESTEK</h2>
</footer>

</body>
</html>
